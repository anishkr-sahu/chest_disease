<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chest CT Scan AI Classifier</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-box {
            width: 100%;
            height: 250px;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            background-color: rgba(56, 189, 248, 0.05);
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }

        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .upload-box span {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        input[type="file"] {
            display: none;
        }

        .btn-group {
            width: 100%;
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #000;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .results-box {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-badge {
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 1rem;
            display: none;
        }

        .status-normal {
            background-color: rgba(34, 197, 94, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-disease {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .train-section {
            margin-top: 2rem;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        #trainStatus {
            color: var(--text-sub);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Chest CT Diagnostic AI</h1>
        <p>Upload a CT Scan image to analyze for potential abnormalities</p>
    </header>

    <div class="container">
        <!-- Input Section -->
        <div class="card">
            <div class="upload-box" id="uploadArea" onclick="document.getElementById('fileInput').click();">
                <div id="uploadPlaceholder">
                    <svg width="48" height="48" fill="none" stroke="#38bdf8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p style="margin-top: 0.5rem; text-align: center;">Click to browse or drop file</p>
                </div>
                <img id="imagePreview" alt="Preview Image" />
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="previewFile()">

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="resetForm()">Clear</button>
                <button class="btn btn-primary" onclick="uploadAndPredict()">Predict</button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="card">
            <div class="results-box">
                <div class="spinner" id="loader"></div>
                <div id="resultText" style="color: var(--text-sub);">Upload an image and click Predict</div>
                <div id="badge" class="status-badge"></div>
            </div>
        </div>
    </div>

    <!-- Retrain Pipeline Trigger -->
    <div class="train-section">
        <div>
            <strong>Retrain Model Pipeline</strong>
            <p id="trainStatus">Triggers DVC pipeline to retrain and update weights in S3</p>
        </div>
        <button class="btn btn-secondary" style="max-width: 150px;" onclick="triggerTraining()">Start Training</button>
    </div>

    <script>
        let base64Image = "";

        // File selection preview & Base64 encoder
        function previewFile() {
            const file = document.getElementById('fileInput').files[0];
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');

            if (file) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    preview.src = reader.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                    // Extract base64 payload without header string
                    base64Image = reader.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        }

        // Send POST request to /predict route
        async function uploadAndPredict() {
            if (!base64Image) {
                alert("Please select an image first!");
                return;
            }

            const loader = document.getElementById('loader');
            const resultText = document.getElementById('resultText');
            const badge = document.getElementById('badge');

            loader.style.display = 'block';
            resultText.style.display = 'none';
            badge.style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();
                loader.style.display = 'none';

                if (data && data[0] && data[0].image) {
                    const status = data[0].image;
                    badge.innerText = status;
                    badge.className = 'status-badge ' + (status === 'Normal' ? 'status-normal' : 'status-disease');
                    badge.style.display = 'inline-block';
                    resultText.style.display = 'none';
                }
            } catch (err) {
                loader.style.display = 'none';
                resultText.style.display = 'block';
                resultText.innerText = "Error completing prediction request.";
                console.error(err);
            }
        }

        // Trigger DVC training route
        async function triggerTraining() {
            const statusText = document.getElementById('trainStatus');
            statusText.innerText = "Training in progress via DVC pipeline...";
            
            try {
                const res = await fetch('/train', { method: 'POST' });
                const msg = await res.text();
                statusText.innerText = msg;
            } catch (err) {
                statusText.innerText = "Failed to run training pipeline.";
            }
        }

        function resetForm() {
            document.getElementById('fileInput').value = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('uploadPlaceholder').style.display = 'block';
            document.getElementById('badge').style.display = 'none';
            document.getElementById('resultText').style.display = 'block';
            document.getElementById('resultText').innerText = "Upload an image and click Predict";
            base64Image = "";
        }
    </script>
</body>
</html>
